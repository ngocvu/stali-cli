name: Health Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - run: bun scripts/e2e-smoke-offline.ts

      - name: Subcommand bundle must not reference wizard
        run: |
          if rg -q 'Wizard-|wizard-launcher|/ui/Wizard' dist/runtime/subcommand-cli.js; then
            echo "::error::subcommand-cli still bundles wizard graph"
            exit 1
          fi
          test -f dist/checksums.json

      - name: Wizard-only partition exists
        run: test -d dist/runtime/wizard-only

      - name: Doctor watch CI smoke
        run: bun dist/index.js doctor --tools-only --watch --max-cycles 2 -i 1 --json | rg -q doctor.snapshot

      - name: Doctor strict + check pendingGateway JSON
        run: |
          bun dist/index.js doctor --strict --tools-only --json > /tmp/doctor-strict.json || true
          test -s /tmp/doctor-strict.json
          bun dist/index.js check --tools-only --json | rg -q '"pendingGateway"'
          bun dist/index.js check --tools-only --json | rg -q '"pendingGatewayCount"'
          bun dist/index.js check --tools-only --json | rg -q '"schemaVersion": 2'

      - name: Pre-commit hook dry-run
        run: |
          mkdir -p /tmp/stali-bin
          printf '%s\n' '#!/usr/bin/env bash' "exec bun \"$PWD/dist/index.js\" \"\$@\"" > /tmp/stali-bin/stali
          chmod +x /tmp/stali-bin/stali
          export PATH="/tmp/stali-bin:$PATH"
          bash -n scripts/examples/git-hooks/pre-commit-stali-doctor.sh
          bash scripts/examples/git-hooks/pre-commit-stali-doctor.sh; code=$?
          test "$code" -eq 0 -o "$code" -eq 1

  live-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install
      - run: bun run build

      - name: Live health gate (tools)
        env:
          STALI_E2E_KEY: ${{ secrets.STALI_E2E_KEY }}
        run: |
          if [ -z "$STALI_E2E_KEY" ]; then
            echo "::notice::STALI_E2E_KEY chưa cấu hình — bỏ qua live gate"
            exit 0
          fi
          bun dist/index.js auth login -k "$STALI_E2E_KEY"
          bun dist/index.js check --strict --tools-only --json
          bun dist/index.js doctor --strict --tools-only --json | head -c 8000
