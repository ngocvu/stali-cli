name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: E2E smoke (offline)
        run: bun scripts/e2e-smoke-offline.ts

      - name: npm pack dry-run
        run: bun run pack:cli && test -f stali-cli-*.tgz

  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Build (with standalone binary)
        run: STALI_BUILD_STANDALONE=1 bun run build

      - name: npm pack
        run: npm pack

      - name: Publish to npm
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret chưa cấu hình — bỏ qua npm publish"
            echo "Thêm NPM_TOKEN trong GitHub → Settings → Secrets → Actions"
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release + assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            stali-cli-*.tgz
            dist/stali-standalone
            dist/checksums.json
