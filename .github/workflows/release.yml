name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: E2E smoke (offline)
        run: bun scripts/e2e-smoke-offline.ts

      - name: npm pack dry-run
        run: bun scripts/verify-npm-pack.ts

  build-standalone:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64
            asset: stali-standalone-linux-x64
          - runner: ubuntu-latest
            target: bun-linux-arm64
            asset: stali-standalone-linux-arm64
          - runner: macos-latest
            target: bun-darwin-arm64
            asset: stali-standalone-darwin-arm64
          - runner: macos-13
            target: bun-darwin-x64
            asset: stali-standalone-darwin-x64
          - runner: windows-latest
            target: bun-windows-x64
            asset: stali-standalone-win-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build standalone (${{ matrix.asset }})
        run: |
          STALI_BUILD_STANDALONE=1 \
          STALI_STANDALONE_NAME=${{ matrix.asset }} \
          STALI_COMPILE_TARGET=${{ matrix.target }} \
          bun run build

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: warn

  # npm publish ngay sau verify — không chờ matrix standalone (macOS queue có thể >30 phút)
  publish-npm:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish to npm
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning::NPM_TOKEN secret chưa cấu hình — bỏ qua npm publish"
            echo "Thêm NPM_TOKEN trong GitHub → Secrets → Actions"
            exit 0
          fi
          VER=$(node -p "require('./package.json').version")
          if echo "$VER" | grep -qE '-(beta|alpha|rc)(\.|$|-)'; then
            DIST_TAG=beta
          else
            DIST_TAG=latest
          fi
          echo "Publishing stali-cli@${VER} with dist-tag=${DIST_TAG}"
          npm publish --access public --provenance --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "skip npm verify (no NPM_TOKEN)"
            exit 0
          fi
          VER=$(node -p "require('./package.json').version")
          npm view "stali-cli@${VER}" version
          test "$(npm view stali-cli@${VER} version)" = "$VER"

  publish-release:
    needs: [verify, build-standalone]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: npm pack
        run: npm pack

      - name: Download standalone artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stali-standalone-*
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release + assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            stali-cli-*.tgz
            dist/checksums.json
            release-assets/*
